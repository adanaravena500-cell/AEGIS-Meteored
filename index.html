<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AEGIS Weather - Panel Meteorológico</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css?v=4.0" />
  </head>
  <body>
    <!-- Encabezado y Buscador -->
    <header>
      <h1 id="cityName">Cargando...</h1>
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Buscar ciudad..." />
        <button id="searchBtn" type="button">Buscar</button>
        <button id="downloadPdfBtn" type="button">📄 Exportar PDF</button>
      </div>
    </header>

    <div class="breadcrumb" id="breadcrumb">Inicio > Clima</div>

    <!-- Layout Principal -->
    <div class="main-container">
      <!-- Panel Izquierdo: Lista de Días + Tarjetas de Información -->
      <aside class="sidebar">
        <h2>Pronóstico 7 Días</h2>
        <div id="dailyContainer" class="daily-container"></div>

        <!-- Tarjetas movidas al panel izquierdo (Debajo de los 7 días) -->
        <div class="cards-grid">
          <div class="card">
            <h3>Temperatura Actual</h3>
            <p class="value"><span id="tempValue">--</span>°C</p>
            <p class="subtext" id="weatherDesc">--</p>
          </div>

          <div class="card">
            <h3>Sensación Térmica</h3>
            <p class="value" id="realFeel">--°C</p>
          </div>

          <div class="card">
            <h3>Viento / Ráfagas</h3>
            <p class="subtext">
              <strong>Velocidad:</strong> <span id="windSpeed">--</span>
            </p>
            <p class="subtext">
              <strong>Ráfagas:</strong> <span id="windGusts">--</span>
            </p>
          </div>

          <div class="card">
            <h3>Sol y Calidad del Aire</h3>
            <p class="subtext" id="sunTimes">Salida: --:-- | Puesta: --:--</p>
            <p class="subtext">
              <strong>Aire:</strong> <span id="airQualityText">--</span>
            </p>
          </div>
        </div>
      </aside>

      <!-- Panel Derecho: Mapa y Carrusel por Hora -->
      <main class="content-area">
        <div id="map"></div>

        <!-- Carrusel por Hora -->
        <div class="hourly-section">
          <h3>Pronóstico por Hora <span id="selectedDayLabel"></span></h3>
          <div id="hourlyContainer" class="hourly-container"></div>
        </div>
      </main>
    </div>

    <!-- Pie de Página -->
    <footer>
      <p>
        &copy; <span id="currentYear"></span>
        <strong>AEGIS Weather System</strong>. Todos los derechos reservados.
      </p>
    </footer>

    <!-- Librerías JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
